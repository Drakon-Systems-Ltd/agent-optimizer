name: CI

# Verification only: install from the lockfile, type-check/build, run the full
# test suite once. No secrets, no publish, no write permissions. `npm test` is
# vitest WATCH mode, so the suite is invoked as `npx vitest run`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: npx vitest run
